[package]
name = "editor_table_plugin"
version = "0.1.4"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "editor_table_plugin"

[dependencies]
engine_fs = { workspace = true }
# The plugin's descriptor and its editor provider's registration.
pulsar_plugins = { workspace = true }
plugin_manager = { workspace = true }
# Plugin API
plugin_editor_api = { workspace = true }

# UI dependencies
gpui-ce = { workspace = true }
ui      = { workspace = true }

ui_common = { workspace = true }
ui_types_common = { workspace = true }

# Engine dependencies
engine_state = { workspace = true }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
log = "0.4"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async operations
futures = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Pin to satisfy both ui (^5) and gpui-ce (^5.3.5)
open = "5.3.5"

[lints]
workspace = true
