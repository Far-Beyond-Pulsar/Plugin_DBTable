# The `pulsar.table_editor` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its editors and file types are
# absent (see crates/core/pulsar_plugins). Its first module carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.table_editor"
name = "Table Editor"
description = "SQLite database tables (.db, .sqlite)"
enabled_by_default = true
requires = []

[modules]
# What a game built for the project links.
runtime = []
# What the editor links in addition.
editor = ["editor_table_plugin"]
